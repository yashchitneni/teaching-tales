<!DOCTYPE html>
<html>
<head>
  <title>Character Selection UI Test</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f3f4f6; }
    .container { max-width: 1200px; margin: 0 auto; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 20px; }
    .card { 
      position: relative; 
      background: #f9fafb; 
      border-radius: 12px; 
      border: 1px solid #e5e7eb;
      cursor: pointer;
      transition: all 0.2s;
      overflow: hidden;
    }
    .card.selected { 
      border: 2px solid #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }
    .card-content { 
      position: relative; 
      height: 180px; 
      overflow: hidden;
      border-radius: 12px;
    }
    .image-container {
      position: absolute;
      inset: 0;
      background: #e5e7eb;
    }
    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .checkmark {
      position: absolute;
      top: 8px;
      right: 8px;
      background: #3b82f6;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }
    .checkmark svg {
      width: 16px;
      height: 16px;
      color: white;
    }
    .special-border {
      position: absolute;
      inset: 0;
      border-radius: 12px;
      pointer-events: none;
      z-index: 1;
      border: 3px solid #eebf17;
      border-bottom-width: 6px;
    }
    .character-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px;
      background: linear-gradient(to top, black, rgba(0,0,0,0.5), transparent);
      color: white;
    }
    h2 { margin-bottom: 10px; }
    .comparison { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 40px; 
      margin-top: 40px; 
    }
    .comparison h3 { margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Character Selection UI Improvements</h1>
    
    <div class="comparison">
      <div>
        <h3>Before (Blue Ring Selection)</h3>
        <div class="grid">
          <div class="card" style="box-shadow: 0 0 0 4px #3b82f6, 0 10px 15px -3px rgba(0, 0, 0, 0.1); transform: scale(1.05);">
            <div class="card-content">
              <div class="image-container">
                <img src="https://via.placeholder.com/300x400/94a3b8/ffffff?text=Selected" alt="Selected">
              </div>
              <div class="character-info">
                <div>Character Name</div>
              </div>
            </div>
          </div>
          <div class="card">
            <div class="card-content">
              <div class="image-container">
                <img src="https://via.placeholder.com/300x400/cbd5e1/ffffff?text=Normal" alt="Normal">
              </div>
              <div class="character-info">
                <div>Other Character</div>
              </div>
            </div>
          </div>
        </div>
      </div>
      
      <div>
        <h3>After (Checkmark Selection)</h3>
        <div class="grid">
          <div class="card selected">
            <div class="card-content">
              <div class="checkmark">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                </svg>
              </div>
              <div class="image-container">
                <img src="https://via.placeholder.com/300x400/94a3b8/ffffff?text=Selected" alt="Selected">
              </div>
              <div class="character-info">
                <div>Character Name</div>
              </div>
            </div>
          </div>
          <div class="card">
            <div class="card-content">
              <div class="image-container">
                <img src="https://via.placeholder.com/300x400/cbd5e1/ffffff?text=Normal" alt="Normal">
              </div>
              <div class="character-info">
                <div>Other Character</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <h2 style="margin-top: 40px;">Special Characters (Yellow Border)</h2>
    <div class="grid" style="max-width: 600px;">
      <div class="card">
        <div class="card-content">
          <div class="special-border"></div>
          <div class="image-container">
            <img src="https://via.placeholder.com/300x400/fbbf24/ffffff?text=Special" alt="Special">
          </div>
          <div class="character-info">
            <div>Special Character</div>
          </div>
        </div>
      </div>
      <div class="card selected">
        <div class="card-content">
          <div class="checkmark">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
            </svg>
          </div>
          <div class="special-border"></div>
          <div class="image-container">
            <img src="https://via.placeholder.com/300x400/fbbf24/ffffff?text=Selected+Special" alt="Selected Special">
          </div>
          <div class="character-info">
            <div>Selected Special</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
